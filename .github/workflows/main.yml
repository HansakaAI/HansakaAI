name: IT Papers to AI Data
on:
  push:
    paths: ['papers_urls.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install PyMuPDF requests
      - run: python scripts/download_and_extract.py
      - run: |
          git config user.name "Paper-Bot"
          git config user.email "bot@bot.com"
          git add data/questions.json
          git commit -m "Update IT papers" || echo "No change"
          git push
